<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            margin:20px;
        }
        table{
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
        }
        table,th,td{
            border:1px solid black;
        }
        th,td{
            padding:10px;
            text-align:center;
        }
        input,select,button{
            margin:5px;
            padding:8px;
        }
    </style>
</head>
<body>

<h2>Student Management System</h2>
<input type="text" id="name" placeholder="Student Name">
<input type="number" id="roll" placeholder="Roll Number">

<select id="branch">
    <option value="CSE">CSE</option>
    <option value="IT">IT</option>
    <option value="ECE">ECE</option>
    <option value="ME">ME</option>
</select>

<button onclick="addStudent()">Add Student</button>

<hr>
<input type="text" id="search" placeholder="Search by Name" onkeyup="searchStudent()">
<select id="filter" onchange="filterBranch()">
    <option value="All">All Branches</option>
    <option value="CSE">CSE</option>
    <option value="IT">IT</option>
    <option value="ECE">ECE</option>
    <option value="ME">ME</option>
</select>

<h3>Total Students: <span id="count">0</span></h3>

<table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Roll No</th>
            <th>Branch</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="studentTable">
    </tbody>
</table>

<p id="message"></p>

<script>
    document.write("<h3>Welcome to the Student Management System</h3>");
    document.write("<p>Manage your students efficiently with this simple system.</p>");
    let a= 100;
    let b= 200;
    let c= ["hello", "world", "javascript"];
    let d= {name: "John", age: 25, branch: "CSE"};
    document.write('a='+a+'type of a='+typeof(a)+'<br>');
    document.write('b='+b+'type of b='+typeof(b)+'<br>');
    


</script>

</body>
</html>
